<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidit Tomar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-beige: #F7F4EF;
            --card-bg: #FFFFFF;
            --text-primary: #2B2927;
            --text-muted: #78726D;
            --accent-subtle: #EFECE6;
            --border-color: #E6E1D8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-beige);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background texture */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 0);
            background-size: 28px 28px;
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 540px;
            width: 90%;
            position: relative;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
        }

        .status-pill {
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            background-color: var(--accent-subtle);
            padding: 0.45rem 1.1rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 4vw, 2.8rem);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        p {
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .contact-section {
            border-top: 1px solid var(--border-color);
            padding-top: 1.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .contact-label {
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 400;
            text-transform: uppercase;
        }

        .contact-email {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-style: italic;
            color: var(--text-primary);
            text-decoration: none;
            transition: opacity 0.2s ease;
            position: relative;
        }

        .contact-email::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: var(--text-primary);
            opacity: 0.3;
            transition: opacity 0.2s ease;
        }

        .contact-email:hover {
            opacity: 0.7;
        }

        .contact-email:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="status-pill">Portfolio &amp; Space</div>
            <h1>Thanks for stopping by.</h1>
            <p>I'm currently revamping my personal corner of the internet. It'll be live soon with a few things I've been working on.</p>
            
            <div class="contact-section">
                <span class="contact-label">Reach out on</span>
                <a href="mailto:hi@vidittomar.com" class="contact-email">hi@vidittomar.com</a>
            </div>
        </div>
    </div>

</body>
</html>
